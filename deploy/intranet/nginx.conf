pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 100m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-DNS-Prefetch-Control off always;
        add_header Content-Security-Policy "default-src 'none'; connect-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; child-src 'none'; frame-src 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'; manifest-src 'self'" always;

        # No external email verification is available. Account creation is a
        # local operator action, never a claim to ownership of an email address.
        location ~ ^/api/auth/sign-up(?:/|$) {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://127.0.0.1:3210;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Fixed destination and preserved host/path are essential for SigV4.
        # No variable upstream, URL forwarder, CONNECT method or S3 console.
        location ^~ /lobehub-files/ {
            proxy_hide_header Content-Disposition;
            add_header Content-Security-Policy "default-src 'none'; script-src 'none'; img-src 'self' data: blob:; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'; sandbox" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Disposition attachment always;
            add_header Referrer-Policy no-referrer always;
            proxy_pass http://172.30.90.12:9000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off;
            proxy_buffering off;
        }
        location / {
            proxy_pass http://127.0.0.1:3210;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }
    }
}
